name: Build MiTray

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Resolve tag name
      id: resolve
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG="${{ github.ref_name }}"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Resolved tag: $TAG"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.resolve.outputs.tag }}

    - name: Compile with Ahk2Exe
      uses: CCCC-L/Action-Ahk2Exe@main
      with:
        in: mitray.ahk
        out: mitray.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mitray-${{ steps.resolve.outputs.tag }}
        path: mitray.exe
        retention-days: 90

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.resolve.outputs.tag }}
        files: mitray.exe
        draft: false
        prerelease: ${{ contains(steps.resolve.outputs.tag, 'beta') || contains(steps.resolve.outputs.tag, 'alpha') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
